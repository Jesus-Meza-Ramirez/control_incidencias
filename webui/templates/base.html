<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Sistema - Login{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="/static/css/styles.css" rel="stylesheet">
  <style>
    /* minimal inline por si no creas styles.css aún */
    body { font-family: system-ui, Arial, sans-serif; background:#0f172a; color:#e2e8f0; margin:0; }
    .center { min-height: 100vh; display:grid; place-items:center; }
    .card { width: 100%; max-width: 380px; background:#111827; border:1px solid #1f2937; border-radius:16px; padding:24px; box-shadow:0 10px 25px rgba(0,0,0,.35); }
    .title { font-size:20px; font-weight:700; margin:0 0 12px; }
    .muted { color:#94a3b8; font-size:12px; margin-bottom:16px; }
    label { display:block; font-size:12px; color:#cbd5e1; margin-bottom:6px; }
    input { width:100%; padding:12px; border-radius:10px; border:1px solid #374151; background:#0b1220; color:#e5e7eb; outline:none; }
    .row { display:flex; gap:10px; align-items:center; justify-content:space-between; margin-top:8px; }
    .btn { width:100%; padding:12px; background:#3b82f6; color:#fff; border:0; border-radius:10px; font-weight:600; cursor:pointer; margin-top:14px; }
    .btn:hover { filter:brightness(1.1); }
    .msg { padding:10px 12px; border-radius:8px; margin-bottom:10px; font-size:13px; }
    .msg.error { background:#7f1d1d; color:#fecaca; border:1px solid #fca5a5; }
    .msg.success { background:#064e3b; color:#bbf7d0; border:1px solid #86efac; }
  </style>
</head>
<body>
  <div class="center">
    <div class="card">
      {% if messages %}
        {% for message in messages %}
          <div class="msg {% if message.tags %}{{ message.tags }}{% endif %}">{{ message }}</div>
        {% endfor %}
      {% endif %}
      {% block content %}{% endblock %}
    </div>
  </div>
</body>
</html>

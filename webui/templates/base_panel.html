<!-- base_panel.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>{% block title %}Panel{% endblock %}</title>

  <style>
    /* Fondo y tipografía global */
    :root { --bg:#0f1a22; --card:#ffffff; }
    html, body { height: 100%; }
    body {
      min-height: 100vh;
      margin: 0;
      background: var(--bg);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: #111827;
    }

    /* Página a pantalla completa */
    .page {
      min-height: 100vh;
      display: flex;
    }

    /* Contenedor central con padding y ancho máximo */
    .container {
      flex: 1;
      max-width: 1200px;
      margin: 24px auto;
      padding: 0 24px;
      display: flex;
    }

    /* Utilidad de tarjeta (opcional) */
    .card {
      background: var(--card);
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
    }
  </style>

  {% block head_css %}{% endblock %}
</head>

<body>
  <div class="page">
    <main class="container">
      {% block content %}{% endblock %}
    </main>
  </div>

  <!-- ⭐ Aquí agregué el bloque que hacía falta ⭐ -->
  {% block scripts %}{% endblock %}

</body>
</html>

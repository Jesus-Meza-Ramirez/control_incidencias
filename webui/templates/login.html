{% extends "base.html" %}
{% load static %}
{% block title %}Iniciar sesión{% endblock %}

{% block content %}
<style>
  /* 1) Neutraliza el contenedor de base.html en ESTA página */
  .app {
    max-width: 100% !important;
    padding: 0 !important;
    background: #0f1e25; /* color de fondo de pantalla completa */
  }
  main { padding: 0 !important; }

  /* 2) Layout full-screen (ocupa todo el viewport) */
  .login-wrapper {
    display: flex;
    min-height: 100vh; /* altura de toda la pantalla */
    width: 100%;
  }

  /* Columna izquierda: imagen */
  .login-left {
    flex: 1.2;
    background: url("{% static 'img/login-bg.jpg' %}") center/cover no-repeat;
  }

  /* Columna derecha: formulario */
  .login-right {
    flex: 0.8;
    background: #157a6e; /* verde institucional */
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
  }

  /* Tarjeta del formulario */
  .form-card {
    width: 100%;
    max-width: 420px;
    background: rgba(0,0,0,0.18);
    border-radius: 14px;
    padding: 28px 28px 32px;
    color: #fff;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }

  .logo {
    text-align: center;
    margin-bottom: 10px;
  }
  .logo img { width: 150px; }

  .welcome { 
    font-size: 28px; 
    font-weight: 800; 
    margin: 6px 0 18px; 
  }

  label { display:block; font-size:14px; margin-bottom:6px; color:#eaf2f1; }
  input {
    width: 100%;
    padding: 11px 12px;
    border: none;
    border-radius: 8px;
    margin-bottom: 14px;
    outline: none;
    font-size: 15px;
    background: #eef2f5;
    color: #0b1720;
  }
  input::placeholder { color:#8aa0b2; }

  .forgot {
    text-align: right; 
    font-size: 13px; 
    margin: -6px 0 14px;
  }
  .forgot a { color:#fde68a; text-decoration:none; }
  .forgot a:hover { text-decoration:underline; }

  .btn-login {
    width: 100%;
    background: #f59e0b; /* botón naranja */
    border: none;
    color: #fff;
    padding: 12px;
    font-weight: 700;
    border-radius: 10px;
    cursor: pointer;
    transition: filter .2s ease;
  }
  .btn-login:hover { filter: brightness(0.95); }

  /* Responsive: en móviles ocultamos la imagen para priorizar el form */
  @media (max-width: 900px) {
    .login-left { display: none; }
    .login-right { flex: 1; }
    .form-card { max-width: 500px; }
  }
</style>

<div class="login-wrapper">
  <!-- Imagen izquierda -->
  <div class="login-left"></div>

  <!-- Formulario derecha -->
  <div class="login-right">
    <div class="form-card">
      <div class="logo">
        <img src="{% static 'img/logo_jaksa.png' %}" alt="JAKSA">
      </div>
      <div class="welcome">Bienvenido</div>

      <form method="POST" action="">
        
        {% csrf_token %}
        <label for="usuario">Usuario</label>
        <input id="usuario" name="usuario" type="text" placeholder="Ingresa tu usuario" required>

        <label for="contrasena">Contraseña</label>
        <input id="contrasena" name="contrasena" type="password" placeholder="Ingresa tu contraseña" required>

        <div class="forgot">
          <a href="#">¿Has olvidado tu contraseña?</a>
        </div>

        <button class="btn-login" type="submit">Iniciar sesión</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
